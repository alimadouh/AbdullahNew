<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.1, maximum-scale=10.0, user-scalable=yes" />
    <title>Medical Guidance</title>
    <link rel="manifest" href="/manifest.json?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pcis-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0891b2" />
    <script>
      // One-time reset for people who opened the site before this version: clears saved settings,
      // old admin logins, cookies and any cached files once, then remembers it was done.
      // Change RESET to a new value to reset everyone again.
      (function () {
        var RESET = '2026-10-01';
        try {
          if (localStorage.getItem('site_reset') === RESET) return;
          localStorage.clear();
          sessionStorage.clear();
          document.cookie.split(';').forEach(function (c) {
            var name = c.split('=')[0].trim();
            if (name) document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
          });
          if (window.caches) caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
          if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
          localStorage.setItem('site_reset', RESET);
        } catch (e) {}
      })();
    </script>
    <script>
      // Apply theme before paint (default dark) to avoid a flash of light
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('theme');
          var saved = localStorage.getItem('theme');
          var dark = p ? p === 'dark' : (saved ? saved === 'dark' : true);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
